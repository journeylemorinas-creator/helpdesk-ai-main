{% extends "base.html" %}
{% block title %}Ticket #{{ ticket_id }} · HelpDesk AI{% endblock %}
{% block content %}
<a class="small text-decoration-none" href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left me-1"></i>All tickets</a>

<div id="ticketRoot" data-ticket-id="{{ ticket_id }}" class="mt-2">
  <div class="text-muted py-5 text-center">Loading…</div>
</div>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="editForm" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="editModalLabel">Edit ticket</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger d-none" id="editError" role="alert"></div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="e_requester_name">Requester name</label>
            <input class="form-control" id="e_requester_name" name="requester_name" maxlength="80">
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="e_requester_email">Requester email</label>
            <input class="form-control" id="e_requester_email" name="requester_email" type="email" maxlength="120">
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="e_title">Title</label>
            <input class="form-control" id="e_title" name="title" maxlength="120">
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="e_description">Description</label>
            <textarea class="form-control" id="e_description" name="description" rows="4" maxlength="2000"></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="e_category">Category</label>
            <select class="form-select" id="e_category" name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="e_priority">Priority</label>
            <select class="form-select" id="e_priority" name="priority">{% for p in priorities %}<option>{{ p }}</option>{% endfor %}</select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="e_status">Status</label>
            <select class="form-select" id="e_status" name="status">{% for s in statuses %}<option>{{ s }}</option>{% endfor %}</select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script>HelpDesk.initTicket({{ statuses|tojson }});</script>{% endblock %}
