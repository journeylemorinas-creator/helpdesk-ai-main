{% extends "base.html" %}
{% block title %}Log in · HelpDesk AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Technician login</h1>
        <p class="text-muted small">Sign in to manage service tickets.</p>
        <form method="post" novalidate>
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="text-center small mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Create one</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
