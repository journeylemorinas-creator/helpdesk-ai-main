services:
  - type: web
    name: helpdesk-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE
        value: /tmp/helpdesk.db
      - key: PYTHON_VERSION
        value: "3.12.3"
